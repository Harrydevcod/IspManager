<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <title>ISPM</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ispm-theme');
          var t;
          if (stored === 'light' || stored === 'dark') {
            t = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            t = 'light';
          } else {
            t = 'dark';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          // Espelha o --bg do styles.css. No escuro leva o alpha do véu que o
          // :root pinta por cima do acrílico (93% → 0xED), para o arranque não
          // piscar uma cor diferente da que a app assenta a seguir.
          document.documentElement.style.background =
            t === 'light' ? '#F6F3EC' : '#05070DED';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
