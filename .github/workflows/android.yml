name: Android SMS Companion

on:
  push:
    branches: [main]
    paths:
      - 'android-sms-companion/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-sms-companion/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sms-companion
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests (signature parity)
        run: gradle test --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ispm-sms-companion-debug-apk
          path: android-sms-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
