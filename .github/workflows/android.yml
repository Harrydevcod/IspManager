name: Android SMS Companion

on:
  push:
    branches: [main]
    paths:
      - 'android-sms-companion/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-sms-companion/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: android-sms-companion
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-retired 'tools' package, which
          # the current sdkmanager rejects (exit 1). Gradle fetches the rest.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests (signature parity)
        run: gradle test --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android-sms-companion/app/build/reports/tests/
          if-no-files-found: ignore

      # Visual smoke: every screen and state as PNG, for the owner to see before the merge.
      - name: Draw the screens (Paparazzi)
        run: gradle recordPaparazziDebug --no-daemon --stacktrace

      - name: Upload screens
        uses: actions/upload-artifact@v4
        with:
          name: ispm-sms-companion-screens
          path: android-sms-companion/app/src/test/snapshots/images/*.png
          if-no-files-found: error

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ispm-sms-companion-debug-apk
          path: android-sms-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Signed release: only on main, only when the keystore secrets exist.
      # One stable signature means the phone updates in place, no uninstall.
      - name: Assemble signed release APK
        if: github.event_name == 'push' && env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ispm-sms.jks"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          gradle assembleRelease --no-daemon --stacktrace
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: Upload release APK
        if: github.event_name == 'push' && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ispm-sms-companion-release-apk
          path: android-sms-companion/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
