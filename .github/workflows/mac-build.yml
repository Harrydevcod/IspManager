# Build macOS do ISPM — corre num runner Apple Silicon e produz dois DMG
# (arm64 + Intel x64) anexados à release da tag.
#
# Porquê os dois electron-rebuild: o package.json tem npmRebuild:false (o
# electron-builder empacota o better_sqlite3.node tal como está em
# node_modules), por isso cada arquitetura tem de ser recompilada
# imediatamente antes do seu empacotamento — senão o DMG Intel levava o
# binário arm64 e crashava (mesma classe do bug de ABI da v0.2.0 no Windows).
#
# Sem assinatura Apple (CSC_IDENTITY_AUTO_DISCOVERY=false): o electron-builder
# faz assinatura ad-hoc (obrigatória em Apple Silicon) e o Gatekeeper pede
# clique-direito → Abrir na primeira execução. Auto-update no macOS exige app
# assinada com Developer ID — fica desativado até haver conta Apple; por isso
# o latest-mac.yml não é publicado.
name: macOS build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release onde anexar os DMG (ex: v1.4.6)'
        required: true

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  mac:
    runs-on: macos-latest
    steps:
      # Sem ref explícito: em push de tag o checkout já é a tag; no dispatch
      # compila o main (tags antigas não têm a config mac) e o input `tag`
      # serve só como release de destino do upload.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar renderer + main
        run: npx tsc --noEmit && npx vite build && npx tsc -p tsconfig.main.json

      - name: Empacotar arm64 (Apple Silicon)
        run: |
          npx electron-rebuild -f -w better-sqlite3 --arch arm64
          npx electron-builder --mac --arm64 --publish never

      - name: Empacotar x64 (Intel)
        run: |
          npx electron-rebuild -f -w better-sqlite3 --arch x64
          npx electron-builder --mac --x64 --publish never

      - name: Anexar DMG à release
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, não interpolado no shell — input de dispatch é untrusted.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" release/*.dmg --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-dmg
          path: release/*.dmg
          if-no-files-found: ignore
