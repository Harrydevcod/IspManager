name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # O mesmo Node que o Electron 41 traz (24.x): a app corre nele, e o
          # agente HTTPS do Node 22 não reutiliza a ligação ao router.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint renderer
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Compile renderer and Electron main
        run: npx vite build && npx tsc -p tsconfig.main.json
