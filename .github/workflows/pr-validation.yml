name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A linha 24 do Electron 41 (24.15): a app corre nela. Sem versão
          # exata de propósito — o Node 24.21 mudou o conjunto de ligações
          # HTTPS e foi a CI que o apanhou antes de o Electron o trazer.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint renderer
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Compile renderer and Electron main
        run: npx vite build && npx tsc -p tsconfig.main.json
